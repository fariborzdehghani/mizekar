name: Deploy Mizekar to PGLCP

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/deploy-daneshyar-pglcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-pglcp-mizekar
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-build-deploy:
    runs-on: [self-hosted, Windows, X64, pglcp-deploy]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      IMAGE_REF: pglcp/mizekar:${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.PGLCP_DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.PGLCP_DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.PGLCP_DEPLOY_USER }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify application
        run: |
          npm exec next typegen
          npm test
          npm run typecheck
          npm run lint

      - name: Build deployment image
        run: docker build --tag "$IMAGE_REF" .

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.PGLCP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PGLCP_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/pglcp_deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/pglcp_deploy_key ~/.ssh/known_hosts

      - name: Transfer image and deploy
        run: |
          set -euo pipefail
          docker save "$IMAGE_REF" | gzip -1 | ssh -i ~/.ssh/pglcp_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'gunzip | docker load >/dev/null'
          scp -i ~/.ssh/pglcp_deploy_key -P "$DEPLOY_PORT" deploy/compose.production.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/apps/mizekar/compose.yml"
          ssh -i ~/.ssh/pglcp_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "export PATH=/root/.nvm/versions/node/v24.18.0/bin:\$PATH; if command -v pm2 >/dev/null 2>&1 && pm2 describe mizekar >/dev/null 2>&1; then pm2 delete mizekar; pm2 save; fi; cd /opt/apps/mizekar && MIZEKAR_IMAGE='$IMAGE_REF' docker compose -p mizekar -f compose.yml up -d --force-recreate --remove-orphans"
          ssh -i ~/.ssh/pglcp_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/signin >/dev/null && exit 0; sleep 3; done; docker compose -p mizekar -f /opt/apps/mizekar/compose.yml logs --tail=120; docker compose -p mizekar -f /opt/apps/mizekar/compose.yml down; if [ -d /root/projects/mizekar ]; then export PATH=/root/.nvm/versions/node/v24.18.0/bin:$PATH; cd /root/projects/mizekar && pm2 start npm --name mizekar -- start && pm2 save; fi; exit 1'
          ssh -i ~/.ssh/pglcp_deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" 'docker image prune -f >/dev/null'
