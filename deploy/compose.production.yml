services:
  app:
    image: ${MIZEKAR_IMAGE:?MIZEKAR_IMAGE is required}
    network_mode: host
    extra_hosts:
      - "api.avalai.ir:127.0.0.1"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 127.0.0.1
      PORT: "3000"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - /opt/apps/mizekar/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/signin').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
